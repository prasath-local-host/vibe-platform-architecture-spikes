name: Demo - deploy Stage or promote Prod
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Demo build workflow run ID
        type: string
        required: true
      environment:
        description: Prod requires the exact candidate to be healthy in Stage
        type: choice
        options: [stage, prod]
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      platform_revision: ${{ steps.run.outputs.platform_revision }}
    steps:
      - id: run
        name: Verify the candidate comes from the successful trusted build workflow
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > run.json
          python3 - <<'PY'
          import json, os, re
          run = json.load(open('run.json'))
          assert run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/demo-build.yml'
          assert run['head_branch'] == os.environ['DEFAULT_BRANCH']
          assert run['event'] in ('workflow_dispatch', 'repository_dispatch')
          assert re.fullmatch('[0-9a-f]{40}', run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('platform_revision=' + run['head_sha'] + '\n')
          PY
  deploy:
    needs: verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment: demo-${{ inputs.environment }}
    concurrency:
      group: demo-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.platform_revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: demo-candidate
          path: candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and deploy the exact artifact
        env:
          TARGET: ${{ inputs.environment }}
        run: python3 deploy/demo/deploy.py "$TARGET" --candidate candidate
