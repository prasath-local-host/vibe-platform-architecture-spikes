services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe-development-only
      POSTGRES_DB: vibe_control
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibe_control"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - vibe-postgres:/var/lib/postgresql/data

volumes:
  vibe-postgres:

