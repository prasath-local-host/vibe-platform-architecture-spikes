services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe-development-only
      POSTGRES_DB: vibe_control
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibe_control"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - vibe-postgres:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-development-only
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  vibe-postgres:
