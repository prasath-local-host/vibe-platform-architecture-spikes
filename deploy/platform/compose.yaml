name: vcp-platform
services:
  platform-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vcp
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?Run prepare.py first}
      POSTGRES_DB: vcp
    volumes:
      - ./data/platform-db:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vcp -d vcp"]
      interval: 5s
      timeout: 3s
      retries: 30
  identity-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run prepare.py first}
      POSTGRES_DB: keycloak
    volumes:
      - ./data/identity-db:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30
  identity:
    image: quay.io/keycloak/keycloak:26.7.0
    command: [start-dev, --import-realm, --http-port=8083]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: platform-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Run prepare.py first}
      KC_HOSTNAME: http://localhost:8083
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx1024m
    volumes:
      - ./private/vibe-realm.json:/opt/keycloak/data/import/vibe-realm.json:ro
    networks: [backend]
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:3200:3200"
    mem_limit: 2g
    security_opt: [no-new-privileges:true]
    depends_on:
      identity-db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
  platform:
    image: vcp-platform:${PLATFORM_REVISION:?Run prepare.py first}
    build:
      context: ./source
      dockerfile: deploy/platform/Dockerfile
    # Shared container namespace, NOT host networking. The BFF and browser
    # tunnel see the same localhost OIDC issuer without disabling validation.
    network_mode: service:identity
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    mem_limit: 1g
    pids_limit: 256
    environment:
      NODE_ENV: development
      LISTEN_HOST: 0.0.0.0
      PORT: "3200"
      DATABASE_URL: postgres://vcp:${PLATFORM_DB_PASSWORD}@platform-db:5432/vcp
      PUBLIC_ORIGIN: http://localhost:3200
      OIDC_ISSUER_URL: http://localhost:8083/realms/vibe
      OIDC_AUDIENCE: vibe-control-plane
      OIDC_CLIENT_ID: vibe-control-plane
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run prepare.py first}
      OIDC_INTROSPECTION_ENABLED: "true"
      OIDC_ALLOW_HTTP: "true"
      SPIKE_IDENTITY_ENABLED: "false"
      STEP_UP_AUTHENTICATION_CONTEXTS: ""
      STEP_UP_AUTHENTICATION_METHODS: otp
      ASSESSMENT_WORKER_ENABLED: "false"
      BUILD_WORKER_ENABLED: "false"
      RELEASE_WORKER_ENABLED: "false"
      INGRESS_RECONCILER_ENABLED: "false"
    depends_on:
      identity:
        condition: service_healthy
        restart: true
      platform-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3200/portal/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
networks:
  # A dedicated bridge allows host-loopback publishing for SSH forwarding.
  # No services join the customer app or Supabase networks.
  backend: {}
